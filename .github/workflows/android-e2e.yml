name: Mobile Appium E2E Automation Pipeline

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-appium-e2e:
    name: Android Emulator (API 29 Nexus 6) & Appium 1,111 Mega Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 3. Verify Android Environment & ADB
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> $GITHUB_PATH
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          adb version || true

      - name: 4. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 5. Install Appium Server and UiAutomator2 Driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: 6. Install Project & Test Dependencies
        run: |
          cd NanoAnalyzer
          npm install

      - name: 7. Build Debug APK
        run: |
          echo "Building debug APK with Gradle..."
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon || true

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=$(pwd)/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "Found debug APK at android/app/build/outputs/apk/debug/app-debug.apk"
          elif [ -f "android/app/release/app-release.apk" ]; then
            echo "APK_PATH=$(pwd)/android/app/release/app-release.apk" >> $GITHUB_ENV
            echo "Using existing APK at android/app/release/app-release.apk"
          else
            FOUND_APK=$(find . -name "*.apk" | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              echo "APK_PATH=$(realpath "$FOUND_APK")" >> $GITHUB_ENV
              echo "Found APK: $FOUND_APK"
            else
              echo "No APK found. Appium tests will execute against system capabilities."
              echo "APK_PATH=" >> $GITHUB_ENV
            fi
          fi

      - name: 8. Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: 9. Run Appium Tests inside Android Emulator (API 29 Nexus 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash NanoAnalyzer/scripts/ci_run_tests.sh

      - name: 10. Prepare Artifacts and GitHub Pages Reports Directory
        if: always()
        run: |
          mkdir -p gh-pages-reports/reports/latest
          mkdir -p gh-pages-reports/reports/history/build-${{ github.run_number }}

          if [ -d "NanoAnalyzer/reports" ]; then
            cp -r NanoAnalyzer/reports/* gh-pages-reports/reports/latest/ 2>/dev/null || true
            cp -r NanoAnalyzer/reports/* gh-pages-reports/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          fi

          # Copy logs and raw results into artifacts folder
          mkdir -p artifacts/
          cp -r NanoAnalyzer/reports/* artifacts/ 2>/dev/null || true
          cp NanoAnalyzer/.wdio-results.jsonl artifacts/ 2>/dev/null || true
          cp /tmp/appium.log artifacts/ 2>/dev/null || true

      - name: 11. Upload Excel and HTML Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-e2e-test-reports
          path: |
            NanoAnalyzer/reports/execution-report.xlsx
            NanoAnalyzer/reports/execution-report.html
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: 12. Upload Appium Server Logs & Diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-server-logs
          path: |
            /tmp/appium.log
            NanoAnalyzer/.wdio-results.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: 13. Deploy Test Reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          folder: gh-pages-reports
          target-folder: ""
          clean: false
